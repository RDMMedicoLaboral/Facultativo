<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facultativo · Gestión de consultorio</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7FA;--surf:#fff;--ink:#152B40;--mut:#63798C;--line:#DDE6ED;--cel:#2678B8;--celbg:#E4F1FB;--sol:#E8A317;--solbg:#FDF0D5;--ok:#1C8A5C;--okbg:#E4F5EC;--bad:#C33B32;--badbg:#FBE9E7;--sh:0 1px 2px rgba(21,43,64,.06),0 1px 12px rgba(21,43,64,.05);--rad:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1721;--surf:#16232F;--ink:#E9F0F6;--mut:#93A7B9;--line:#28394A;--cel:#6FB6EC;--celbg:#1B3348;--sol:#F0BB4D;--solbg:#3A2E10;--ok:#57CB98;--okbg:#123324;--bad:#F08A80;--badbg:#3A1712;--sh:0 1px 2px rgba(0,0,0,.3),0 1px 14px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0D1721;--surf:#16232F;--ink:#E9F0F6;--mut:#93A7B9;--line:#28394A;--cel:#6FB6EC;--celbg:#1B3348;--sol:#F0BB4D;--solbg:#3A2E10;--ok:#57CB98;--okbg:#123324;--bad:#F08A80;--badbg:#3A1712;--sh:0 1px 2px rgba(0,0,0,.3),0 1px 14px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(155deg,#152B40,#1E3A55);color:#fff;padding:20px 20px 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.brand{display:flex;align-items:baseline;gap:12px;max-width:980px;margin:0 auto}
h1{font:700 28px/1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em;color:#fff}
.brand span{color:#9FB6CB;font-size:13px;letter-spacing:.02em}
nav{display:flex;gap:2px;max-width:980px;margin:16px auto 0;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:#9FB6CB;font:500 14.5px Figtree,sans-serif;padding:10px 14px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-color:var(--sol);font-weight:600}
main{max-width:980px;margin:0 auto;padding:26px 16px 48px}
h2{font:600 23px Fraunces,Georgia,serif;margin:0 0 16px;letter-spacing:-.01em}
h3{font:600 16.5px Fraunces,Georgia,serif;margin:18px 0 10px;color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12.5px;font-weight:600;color:var(--mut);gap:5px;flex:1 1 150px;letter-spacing:.01em}
input,select,textarea{font:400 15px Figtree,inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 11px;width:100%;transition:border-color .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:var(--mut)}
input:focus,select:focus,textarea:focus{background:var(--surf)}
textarea{min-height:56px;resize:vertical;font-family:Figtree,inherit}
.card>label,details.card>label{max-width:560px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--cel);outline-offset:2px}
.btn{background:var(--cel);color:#fff;border:0;border-radius:7px;padding:10px 18px;font:600 14.5px Figtree,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(21,43,64,.15);transition:filter .15s,transform .1s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
.btn.g{background:none;color:var(--cel);border:1px solid var(--cel);box-shadow:none}
.btn.g:hover{background:var(--celbg)}
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-weight:700;color:var(--mut);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr{transition:background .12s}tbody tr:hover{background:var(--bg)}
.chip{display:inline-block;background:var(--celbg);color:var(--cel);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700;letter-spacing:.01em}
.chip.sol{background:var(--solbg);color:#8A6416}
.st-Atendido{color:var(--ok);font-weight:600}.st-Ausente,.st-Cancelado{color:var(--bad);font-weight:600}
.err{color:var(--bad);font-size:13.5px;min-height:18px;margin:10px 0 0;font-weight:600}
.empty{color:var(--mut);padding:22px 4px;text-align:center;font-size:14.5px}
.dni{font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.02em}
.evo{border-left:3px solid var(--sol);padding:6px 0 6px 14px;margin:14px 0;font-size:14.5px}
.evo small{color:var(--mut)}
.link{background:none;border:0;color:var(--cel);cursor:pointer;font:600 inherit;padding:0;text-decoration:underline;text-underline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stats div{background:var(--surf);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--sh);padding:14px 16px}
.stats b{display:block;font:700 27px Fraunces,Georgia,serif;color:var(--cel)}
.stats span{color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.01em}
footer{max-width:980px;margin:8px auto 0;padding:18px 16px 34px;color:var(--mut);font-size:12.5px;border-top:1px solid var(--line);line-height:1.6}
summary{cursor:pointer;font-weight:700;color:var(--cel);font-size:15px}
fieldset{border:1px solid var(--line);border-radius:7px;margin:0;padding:8px 12px 10px;flex:1 1 220px;min-width:0}legend{font-size:12.5px;font-weight:600;color:var(--mut);padding:0 4px}
.rad{flex-direction:row;align-items:center;gap:7px;font-size:14.5px;font-weight:400;color:var(--ink);display:flex}.rad input{width:auto}
.req{color:var(--mut);font-size:13.5px;margin:0 0 14px}
.warn{color:#8A6416;background:var(--solbg);border-radius:99px;padding:3px 11px;font-size:12.5px;font-weight:700}
.mut{color:var(--mut);font-size:13.5px}
a{color:var(--cel)}[hidden]{display:none!important}
nav button:last-child{margin-left:auto;color:var(--sol)}nav button.on:last-child{color:#fff}
details.card summary{margin:-2px 0 0}details.card[open] summary{margin-bottom:14px}
.formhdr{background:linear-gradient(135deg,#2678B8,#1A4F7A);color:#fff;padding:16px 18px;border-radius:var(--rad) var(--rad) 0 0;margin:-18px -18px 18px}
.formhdr b{font:700 21px Fraunces,Georgia,serif;display:block}
.formhdr span{opacity:.85;font-size:13px}
.step{color:var(--cel);font:700 12px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.06em;margin:18px 0 2px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.qrow:last-child{border-bottom:0}
.qtxt{display:flex;gap:10px;align-items:baseline;flex:1 1 220px}
.qtxt b{color:var(--mut);font-size:12.5px;min-width:16px}
.yn{display:flex;gap:8px}
.yn label{border:1px solid var(--line);border-radius:7px;padding:6px 16px;font-size:13.5px;cursor:pointer;background:var(--surf)}
.yn input{display:none}
.yn label:has(input:checked){background:var(--celbg);border-color:var(--cel);color:var(--cel);font-weight:700}
.nrs{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.nrs label{border:1px solid var(--line);border-radius:7px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--surf)}
.nrs input{display:none}
.nrs label:has(input:checked){background:var(--cel);border-color:var(--cel);color:#fff;font-weight:700}
.sevgrid{overflow-x:auto;margin:8px 0}
.sevgrid table{border-collapse:collapse;width:100%;font-size:12.5px}
.sevgrid th{font-weight:600;color:var(--mut);padding:4px 6px;text-align:center;white-space:nowrap}
.sevgrid td{padding:8px 6px;border-top:1px solid var(--line)}
.sevgrid td.lbl{text-align:left;white-space:normal;min-width:150px}
.sevgrid td.opt{text-align:center}
.docbox{border:1px solid var(--ink);border-radius:8px;padding:14px 16px;margin-bottom:18px;font-size:14px;line-height:2.1}
.docbody{font-size:13.5px;line-height:1.6;column-count:1;column-gap:28px}
@media(min-width:680px){.docbody{column-count:2}}
.docbody h4{color:var(--cel);font:700 12.5px Figtree,sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 4px;break-after:avoid}
.docbody h4:first-child{margin-top:0}
.docbody p{margin:0 0 10px}
.docbody ul{margin:2px 0 10px 18px;padding:0}
.docbody li{margin:3px 0}
.docsig{border-top:2px solid var(--ink);margin-top:22px;padding-top:14px;font-size:13.5px}
.sigrow{display:flex;gap:30px;margin-top:22px;flex-wrap:wrap}
.sigrow div{flex:1 1 170px;border-top:1px solid var(--ink);padding-top:6px;font-size:12.5px;color:var(--mut)}
.idbox{display:flex;gap:18px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:13px}
.idbox b{color:var(--mut);font-weight:600}
</style>
</head>

consTpl:[{id:1,nombre:"Uso de medicamentos controlados a largo plazo (dolor crónico)",cuerpo:"## Razones para el uso de estos medicamentos\nLos medicamentos controlados (opioides u otros fármacos de prescripción controlada) pueden reducir mi dolor crónico y mejorar mi capacidad de realizar actividades diarias. Los elegimos porque otros tratamientos no me ayudaron lo suficiente.\n- Mis síntomas pueden mejorar, aunque es posible que no desaparezcan por completo\n- Puedo necesitar más estudios para elegir el mejor tratamiento\n- Mi médico puede cambiar el tratamiento para que sea el mejor para mí\n\n## Riesgo de uso incorrecto o por terceros\n- Son medicamentos muy potentes y pueden ser peligrosos si no los tomo como me indicaron\n- Nadie más que yo debe tomar mis medicamentos\n- Pueden ocasionar una sobredosis o la muerte\n\n## Efectos secundarios\n- Somnolencia o cansancio, estreñimiento, malestar estomacal, picazón en la piel\n- Respiración lenta o poco profunda; en caso de sobredosis, puede dejar de respirar\n- No debo manejar maquinaria pesada hasta saber cómo me afecta el medicamento\n- Debo avisar a mi médico si tomo otros medicamentos, por posibles interacciones\n\n## Dependencia física y abstinencia\nMi cuerpo se puede volver dependiente de estos medicamentos; esto es normal. Si los reduzco o suspendo bruscamente puedo tener síntomas de abstinencia (dolor de estómago, nerviosismo, diarrea, taquicardia, temblor, secreción nasal). Son incómodos pero tratables, y los medicamentos deberían reducirse gradualmente, no de golpe.\n\n## Tolerancia y adicción\nMi cuerpo puede volverse tolerante y necesitar más dosis con el tiempo. Los opioides pueden causar adicción, con mayor riesgo si tengo antecedentes personales o familiares de consumo problemático de sustancias; es importante que se lo informe a mi médico.\n\n## Embarazo\nSi estoy embarazada o busco un embarazo, debo informarlo a mi médico: el bebé podría nacer con dependencia a estos medicamentos."},
{id:2,nombre:"Procedimiento intervencionista (bloqueos / infiltraciones)",cuerpo:"## Identificación y descripción del procedimiento\n- Consiste en la introducción de un medicamento (anestésico local o corticoide) en la zona a tratar (bloqueo nervioso, infiltración articular o facetaria u otro procedimiento intervencionista)\n- Es una técnica habitualmente poco dolorosa, aunque puede resultar incómoda\n- Cuando corresponde, se utiliza guía por imágenes (radioscopia/ecografía) para localizar el sitio de punción\n- Puede ser diagnóstico (efecto pasajero, para localizar el origen del dolor) o terapéutico (de mayor duración)\n- Suele durar entre 20 y 30 minutos, con anestesia local\n\n## Objetivos y beneficios esperados\n- Mejoría del dolor y de la funcionalidad\n\n## Alternativas razonables\n- Tratamiento farmacológico por vía oral u otras terapias no invasivas\n\n## Consecuencias si no se realiza\n- Persistencia o menor mejoría del dolor\n\n## Riesgos\n- Molestias locales en el sitio de punción, que ceden en pocas horas con analgésicos comunes\n- Síncope vasovagal (mareo, sudoración, sensación de desvanecimiento), no grave y tratable\n- De forma poco frecuente, otras complicaciones más serias asociadas a la técnica\n- Existen riesgos particulares según mis antecedentes, que fueron conversados con mi médico\n\n## Contraindicaciones\n- No se podrá realizar si existen trastornos de la coagulación o infección en la zona de punción"}],

<h2>Liquidaciones por consultorio</h2><div class="card tw"><table><tr><th>Consultorio</th><th>Pacientes cobrados</th><th>Facturado</th><th>% aplicado</th><th>Retenido por MP</th><th>Saldo pendiente</th><th>Estado</th></tr>${filas.map(x=>`<tr><td><b>${nomPro(x.p)}</b><br><small class="mut">${esc(x.p.esp)}</small></td><td>${x.c.n}</td><td>${money(x.c.total)}</td><td>${x.c.pct}%</td><td>${money(x.c.comApp)}</td><td><b style="${x.saldo>S.umbral?"color:var(--bad)":""}">${money(x.saldo)}</b>${x.saldo>S.umbral?` <span class="warn">excede el tope</span>`:""}</td><td><span class="chip ${x.p.activo?"":"sol"}">${x.p.activo?"Activo":"Inactivo"}</span><br><button class="link" style="margin-top:4px" onclick="toggleActivo(${x.p.id})">${x.p.activo?"Desactivar":"Activar"}</button></td></tr>`).join("")}</table></div>
<details class="card"><summary>Registrar una liquidación recibida (transferencia manual)</summary><div class="row">
<label style="flex-basis:220px">Consultorio<select id="liq_pid">${proOpts()}</select></label><label style="flex-basis:160px">Monto recibido<input id="liq_m" type="number" min="0" step="500"></label>
